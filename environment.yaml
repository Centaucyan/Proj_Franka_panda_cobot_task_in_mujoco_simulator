name: ros2_mujoco_panda_py3_10
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24.0,<2.0.0
  - scipy>=1.10.0
  - pyyaml
  - pip:
      # 물리 엔진 및 시뮬레이션
      - mujoco>=3.6.0
      
      # 강화학습 및 딥러닝
      - torch>=2.0.0
      - gymnasium>=0.29.0
      - stable-baselines3>=2.2.0
      
      # 비전 및 3D 데이터 처리
      - opencv-python>=4.8.0
      - open3d>=0.17.0
      - transforms3d>=0.4.1
      
      # ROS2 빌드 및 유틸리티
      - colcon-common-extensions
      - setuptools==58.2.0
      - rich
      - matplotlib